<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>J.A.R.V.I.S. — Mark VIII</title>
<style>
:root{color-scheme:dark;--cyan:#48eaff;--bg:#050b15}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at center,#102b40 0,#050b15 65%);color:#d8fbff;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:20px}.panel{width:min(680px,100%);text-align:center;border:1px solid #48eaff66;border-radius:24px;padding:clamp(24px,6vw,48px);background:#06121bd9;box-shadow:0 0 50px #20dfff20}h1{font-size:clamp(30px,8vw,56px);letter-spacing:.12em;color:var(--cyan);margin:0}p{color:#91bdc9}.orb{width:150px;height:150px;border:2px solid var(--cyan);border-radius:50%;margin:28px auto;display:grid;place-items:center;box-shadow:0 0 24px #48eaff55,inset 0 0 24px #48eaff33}.orb span{font-size:52px;color:var(--cyan)}button{background:#082c3a;color:var(--cyan);border:1px solid var(--cyan);padding:14px 18px;margin:6px;border-radius:12px;font-weight:700;cursor:pointer}button:active{background:#145269}#status{min-height:48px;padding:14px;border-radius:10px;background:#061b27;color:#b9f7ff;margin-top:20px}.small{font-size:12px;letter-spacing:.16em;color:#6595a3}
</style>
</head>
<body><main class="panel"><div class="small">MARK-VIII • ANDROID VOICE CORE</div><h1>J.A.R.V.I.S.</h1><p>JUST A RATHER VERY INTELLIGENT SYSTEM</p><div class="orb"><span>⌁</span></div><button onclick="startVoice()">🎙 INITIATE VOICE CORE</button><div><button onclick="setLang('EN')">ENGLISH</button><button onclick="setLang('HI')">हिन्दी</button><button onclick="setLang('BN')">বাংলা</button></div><div id="status" role="status">System ready. Tap the microphone to speak.</div><p class="small">VOICE INPUT IS USER-ACTIVATED • LOCAL COMMAND ENGINE</p></main>
<script>
function jarvisStatus(message){document.getElementById('status').textContent=message}
function startVoice(){if(window.JarvisAndroid){JarvisAndroid.startListening()}else{jarvisStatus('Native Android voice bridge unavailable.')}}
function setLang(code){if(window.JarvisAndroid)JarvisAndroid.setLanguage(code);jarvisStatus('Language selected: '+code)}
</script></body></html>
